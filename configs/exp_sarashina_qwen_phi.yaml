simulation:
  duration: 30
  half_space_size: 25
  seed: 42
  run_name: exp_sarashina_qwen_phi

blocs:
  - name: sarashina
    model: "hf.co/mmnga/sarashina2.2-3b-instruct-v0.1-gguf:Q8_0"
    base_url: "http://localhost:11434"
    num_agents: 4
  - name: qwen
    model: "qwen2.5:3b"
    base_url: "http://localhost:11434"
    num_agents: 4
  - name: phi
    model: "hf.co/mmnga/Phi-4-mini-instruct-gguf:Q6_K"
    base_url: "http://localhost:11434"
    num_agents: 4

agents:
  communication_radius: 5
  memory_limit: 20
  memory_size: 5
  message_history_limit: 10
  message_context_size: 3

places:
  - {name: L_bar, center_x: -15, center_y: 0, half_size: 5, capacity: 6}
  - {name: R_bar, center_x: 15, center_y: 0, half_size: 5, capacity: 5}

llm_defaults:
  temperature: 0.2
  max_tokens: 1024
  timeout_s: 120
